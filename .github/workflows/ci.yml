name: CI
on: [push, pull_request]
jobs:
  install:
    name: Install project
    strategy:
      matrix:
        # operating-systems: ubuntu-latest, windows-latest, macos-latest
        operating-system: [ubuntu-latest]
        php-versions: ['8.3', '8.4', '8.5', '8.6']
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Start web server
        working-directory: web
        run: |
          php -S 127.0.0.1:8888 index.php > /tmp/herbie-smoke-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8888/index.php/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/herbie-smoke-server.log
          exit 1

      - name: Run smoke tests
        run: php tests/smoke.php
